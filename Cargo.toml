[workspace]
members = ["crates/proto", "crates/shared", "master", "slave", "desktop/src-tauri"]
default-members = ["crates/proto", "crates/shared", "master", "slave"]
resolver = "3"

[workspace.dependencies]
proto = { path = "crates/proto" }
shared = { path = "crates/shared" }
prost = "0.14.6"
prost-build = "0.14.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
