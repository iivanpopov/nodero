version: "2"
sql:
  - engine: "mysql"
    schema: "migrations/"
    queries: "internal/features/users/repository/mysql/queries/"
    gen:
      go:
        package: "sqlc"
        out: "internal/features/users/repository/mysql/sqlc"
        emit_json_tags: true
        emit_empty_slices: true
  - engine: "mysql"
    schema: "migrations/"
    queries: "internal/features/auth/repository/mysql/queries/"
    gen:
      go:
        package: "sqlc"
        out: "internal/features/auth/repository/mysql/sqlc"
        emit_json_tags: true
        emit_empty_slices: true
